<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Hazem Abdelazez</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#090C12">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('portfolio-theme');
      var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root {
    --bg: #090C12;
    --surface: #111622;
    --border: rgba(226, 232, 240, 0.14);
    --text: #F1F5F9;
    --text-secondary: #CBD5E1;
    --accent: #60A5FA;
    --cta-bg: #1D4ED8;
    --cta-hover: #2563EB;
  }
  [data-theme="light"] {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: rgba(15, 23, 42, 0.14);
    --text: #0F172A;
    --text-secondary: #334155;
    --accent: #1D4ED8;
    --cta-bg: #1D4ED8;
    --cta-hover: #1E40AF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    max-width: 520px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.5rem 2rem;
    text-align: center;
  }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.025em;
    margin-bottom: 0.75rem;
  }
  p {
    color: var(--text-secondary);
    font-size: 0.98rem;
    line-height: 1.65;
    margin-bottom: 1.75rem;
  }
  .actions {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.65rem 1.35rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    background: var(--cta-bg);
    color: #ffffff;
    transition: background-color 0.15s ease;
  }
  .btn:hover { background: var(--cta-hover); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="card">
    <div class="code">HTTP 404</div>
    <h1>Page not found</h1>
    <p>The page you requested does not exist on Hazem Abdelazez's portfolio. Return to the homepage to explore projects, work experience, and credentials.</p>
    <div class="actions">
      <a href="/" class="btn">Back to Portfolio</a>
    </div>
  </main>
</body>
</html>
